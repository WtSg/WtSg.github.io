<dialog class="gl" aria-label="A photograph, up close">
  <figure class="gl__stage"><img class="gl__img" src="" alt="" draggable="false"><span class="gl__frame" aria-hidden="true"></span></figure>
  <div class="gl__info">
    <div class="gl__led" aria-hidden="true"></div>
    <div class="gl__cap"></div>
    <dl class="gl__spec"></dl>
  </div>
  <div class="gl__controls">
    <button class="gl__btn" type="button" data-gl="prev" aria-label="Previous photograph">{% include gl-icon.html name="prev" %}</button>
    <span class="gl__count" aria-live="polite"></span>
    <button class="gl__btn" type="button" data-gl="next" aria-label="Next photograph">{% include gl-icon.html name="next" %}</button>
    <div class="gl__film">
      <svg class="gl__reel" viewBox="0 0 60 60" aria-hidden="true" focusable="false"><circle class="gl__reel-rim" cx="30" cy="30" r="28"/><circle class="gl__reel-wound" cx="30" cy="30" r="14" data-wind/><g data-rotor="18"><circle class="gl__reel-hub" cx="30" cy="30" r="10"/><rect class="gl__reel-slot" x="28.6" y="20.6" width="2.8" height="6.6" rx="1.2"/><rect class="gl__reel-slot" x="28.6" y="20.6" width="2.8" height="6.6" rx="1.2" transform="rotate(120 30 30)"/><rect class="gl__reel-slot" x="28.6" y="20.6" width="2.8" height="6.6" rx="1.2" transform="rotate(240 30 30)"/><circle class="gl__reel-pin" cx="30" cy="30" r="2"/></g></svg>
      <div class="gl__track"><ol class="gl__roll" aria-label="Every photograph"></ol><span class="gl__gate" aria-hidden="true"></span></div>
      <svg class="gl__can" viewBox="0 0 60 60" aria-hidden="true" focusable="false"><defs><radialGradient id="gl-can-metal" cx="38%" cy="30%" r="78%"><stop offset="0" stop-color="#55514b"/><stop offset=".5" stop-color="#26241f"/><stop offset="1" stop-color="#100f0d"/></radialGradient></defs><rect class="gl__can-lip" x="1" y="22" width="12" height="16" rx="1.5"/><circle cx="33" cy="30" r="26" fill="url(#gl-can-metal)" class="gl__can-body"/><circle class="gl__can-ridge" cx="33" cy="30" r="21"/><g data-rotor="12"><circle class="gl__can-knob" cx="33" cy="30" r="8.5"/><rect class="gl__can-fork" x="31.9" y="22.8" width="2.2" height="14.4" rx="1"/><circle class="gl__can-mark" cx="33" cy="24.2" r="1.1"/></g></svg>
    </div>
    <button class="gl__btn gl__btn--close" type="button" data-gl="close" autofocus>{{ include.close | default: "Close" }}</button>
  </div>
</dialog>
