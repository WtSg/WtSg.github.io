<dialog class="gl" aria-label="A photograph, up close">
  <figure class="gl__stage"><img class="gl__img" src="" alt="" draggable="false"><span class="gl__frame" aria-hidden="true"></span></figure>
  <div class="gl__info">
    <div class="gl__led" aria-hidden="true"></div>
    <div class="gl__cap"></div>
    <dl class="gl__spec"></dl>
  </div>
  <div class="gl__controls">
    <button class="gl__btn" type="button" data-gl="prev" aria-label="Previous photograph">{% include gl-icon.html name="prev" %}</button>
    <span class="gl__count" aria-live="polite"></span>
    <button class="gl__btn" type="button" data-gl="next" aria-label="Next photograph">{% include gl-icon.html name="next" %}</button>
    <div class="gl__film">
      <svg class="gl__reel" viewBox="0 0 44 96" aria-hidden="true" focusable="false"><defs><linearGradient id="gl-cyl" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".65"/><stop offset=".4" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></linearGradient><pattern id="gl-wound-holes" patternUnits="userSpaceOnUse" width="13.5" height="96" data-scroll="1"><rect x="0" y="18.7" width="6.3" height="3.6" rx=".6"/><rect x="0" y="73.7" width="6.3" height="3.6" rx=".6"/></pattern></defs><rect class="gl__reel-flange" x="2" y="8" width="40" height="5" rx="2"/><rect class="gl__reel-flange" x="2" y="83" width="40" height="5" rx="2"/><rect class="gl__reel-core" x="16" y="13" width="12" height="70"/><rect class="gl__reel-wound" x="16" y="16" width="12" height="64" data-wind/><rect class="gl__reel-holes" x="16" y="16" width="12" height="64" fill="url(#gl-wound-holes)" data-wind/><rect x="16" y="13" width="12" height="70" fill="url(#gl-cyl)" data-wind/><rect class="gl__reel-pin" x="19" y="3.5" width="6" height="5" rx="1"/></svg>
      <div class="gl__track"><ol class="gl__roll" aria-label="Every photograph"></ol><span class="gl__gate" aria-hidden="true"></span></div>
      <svg class="gl__can" viewBox="0 0 44 96" aria-hidden="true" focusable="false"><defs><linearGradient id="gl-can-side" x1="0" x2="1"><stop offset="0" stop-color="#0e0d0c"/><stop offset=".3" stop-color="#34312c"/><stop offset=".5" stop-color="#5d5850"/><stop offset=".72" stop-color="#2a2824"/><stop offset="1" stop-color="#0c0b0a"/></linearGradient><pattern id="gl-knurl" patternUnits="userSpaceOnUse" width="2.6" height="10" data-scroll=".5"><rect x="0" y="0" width="1.1" height="10"/></pattern></defs><rect class="gl__can-body" x="8" y="7" width="32" height="82" rx="4" fill="url(#gl-can-side)"/><rect class="gl__can-band" x="8" y="34" width="32" height="28"/><rect class="gl__can-cap" x="6" y="4.5" width="36" height="6" rx="2"/><rect class="gl__can-cap" x="6" y="85.5" width="36" height="6" rx="2"/><rect class="gl__can-lip" x="0" y="13" width="14" height="70" rx="1.5"/><rect class="gl__can-felt" x="0.8" y="14.2" width="12.4" height="1.6"/><rect class="gl__can-felt" x="0.8" y="80.2" width="12.4" height="1.6"/><rect class="gl__can-knob" x="17" y="0" width="14" height="5.5" rx="1.5"/><rect class="gl__can-knurl" x="17" y="0" width="14" height="5.5" rx="1.5" fill="url(#gl-knurl)"/><rect class="gl__can-tick" x="23.4" y=".6" width="1.2" height="4.3" data-tick="24 6.2"/></svg>
    </div>
    <button class="gl__btn gl__btn--close" type="button" data-gl="close" autofocus>{{ include.close | default: "Close" }}</button>
  </div>
</dialog>
