- group: earlier
  name: "CURE: Cross-Video Neural Representations for Frame Interpolation"
  dates: 2020 – 2022
  org: Washington University in St. Louis
  image: /img/web/cure-480.mp4
  w: 480
  h: 480
  poster: /img/web/cure-480-poster.jpg
  image_alt: Side-by-side video of input frames and CURE's interpolated frames
  url: https://cure.wshangguan.com
  cite: cure
  description: >-
    A deep-learning model for video frame interpolation, which synthesizes a
    new frame from its two neighbors. It was the first video interpolation
    method based on neural fields and achieved state-of-the-art results on
    several benchmark datasets. Published at ECCV 2022.

- group: earlier
  name: Underwater Spectrophotometer for In-Situ Seawater COD Monitoring
  dates: "2019"
  org: SIAT
  image: /img/cod.jpg
  w: 521
  h: 383
  image_alt: The underwater COD sensor and the buoy used in coastal trials
  url: https://www.spiedigitallibrary.org/conference-proceedings-of-spie/11752/2588022/Underwater-spectrophotometer-for-in-situ-seawater-COD-monitoring/10.1117/12.2588022.full
  description: >-
    An in-situ chemical oxygen demand (COD) sensor for long-term seawater
    monitoring, integrated into a buoy for coastal trials. The sensors worked
    underwater continuously for more than six months and recorded thousands of
    UV-Vis absorption spectra.

- group: earlier
  name: Adaptive Single-Photon Compressed Imaging
  dates: "2018"
  org: Nanchang University
  image: /img/compressedSPC.jpg
  w: 330
  h: 266
  image_alt: Reconstructions from standard and adaptive measurement matrices
  url: https://doi.org/10.3390/s18103449
  cite: spc
  description: >-
    A single-photon imaging system is a photon-counting single-pixel camera
    that images with compressed sensing (CS). We proposed a smart adaptive
    measurement matrix to improve CS reconstruction; experiments show it works
    with many algorithms and can modify any kind of measurement matrix.

- group: earlier
  name: Wireless Auto-Detection Electromagnetic Gun
  dates: "2017"
  org: Nanchang University
  image: /img/web/emg-800.jpg
  w: 800
  h: 662
  image_alt: The electromagnetic gun and its wireless controller
  description: >-
    A wireless electromagnetic gun; both the radio and the gun run on an
    STM32F103. The radio shows voltage and firing status and detects nearby
    objects, sending a fire signal over 2.4 GHz (nRF24L01). Two XL6009
    converters step 12 V DC up to about 70 V, and the steel ball travels about
    30 feet.

- group: earlier
  name: Three-Phase DC-AC Converter
  dates: "2017"
  org: Nanchang University
  image: /img/web/dcac-800.jpg
  w: 800
  h: 744
  image_alt: The three-phase DC-AC converter circuit boards
  description: >-
    Converts 12 V DC to three-phase 24 V AC under STM32F103 control, with
    voltage regulation, phase regulation and over-current protection.
    Efficiency is above 90%, phase regulation lets two converters connect to a
    grid, and a PID loop regulates the output 100 times per second.
