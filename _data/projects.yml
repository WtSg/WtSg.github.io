# Newest first; shown in the order listed.
# group: current -> "Current work" list; earlier -> "Earlier work" figure grid
# (needs `image` plus its pixel size as `w` and `h`; the frame and ticks follow them).
# Optional `figure` (src, w, h, alt, caption) on any entry shows a numbered figure under it.

- group: current
  id: transformer
  name: Information Sharing Across Transformer Layers
  dates: Sep 2026 – present
  description: >-
    Efficient LLM architectures that share information across Transformer
    layers without reading from every layer (in recent tests at 40M
    parameters, 8.9% lower held-out perplexity than a standard Transformer,
    and ahead of Kimi's Block Attention Residuals, published in 2026). Trained
    40M-parameter, 48-layer decoder-only Transformers from scratch on about
    200M FineWeb-Edu tokens.

- group: current
  id: cfg
  name: Noise-Aware Classifier-Free Guidance
  dates: Sep 2026 – present
  description: >-
    A noise-informed schedule for the guidance strength, with no extra training
    or network evaluations. On DiT-XL/2 with 50-step DDIM: 23–30% lower FID and
    22–25% lower FD-DINOv2 than constant guidance at matched class accuracy.
    Also tested across step counts and on SiT flow models.
  figure:
    src: /img/figures/guidance-paired-samples.webp
    w: 1600
    h: 841
    alt: >-
      Two rows of four generated images (a man holding a fish, goldfish, a
      great white shark and a tiger shark), with the same subjects in both rows.
    caption: >-
      Class-conditional samples from the same seeds, with noise-aware guidance
      (top) and DG-CFG (bottom).

- group: current
  id: ual
  name: Diffusion Posterior Sampling with Uncertain Forward Models (UAL)
  dates: May – Sep 2026
  cite: ual
  description: >-
    An uncertainty-aware likelihood that keeps pretrained diffusion priors
    reliable when the forward model is uncertain. Tested on six inverse
    problems (Gaussian and motion deblurring, CT, MRI, ultrasound and
    fluorescence microscopy), with better ensemble predictions (CRPS, energy
    and variogram scores).
  figure:
    src: /img/figures/ual-results.webp
    w: 1800
    h: 860
    alt: >-
      Grid of reconstructions for Gaussian blur, motion blur, CT, MRI,
      ultrasound and microscopy, in rows labelled Ref, Pub and UAL.
    caption: Results on six inverse problems, from the UAL preprint

- group: current
  id: specdepth
  name: "SpecDepth: Physics-Guided Reference-Free Adaptation of Depth Priors for Hyperspectral LWIR Ranging"
  dates: Nov 2023 – May 2026
  description: >-
    Adapts a frozen DINOv2-DPT metric-depth model to a 256-band passive LWIR
    hyperspectral cube without depth labels, lidar, stereo or RGB. The model
    predicts depth, temperature and per-band emissivity and is coupled to a
    differentiable radiative-transfer renderer; lidar is used only for
    held-out evaluation.
  figure:
    src: /img/figures/specdepth-forest.webp
    w: 1610
    h: 246
    alt: >-
      Four panels of a distant forest: the broadband LWIR image and depth maps
      from UniDepth-V2, physics inversion and SpecDepth.
    caption: >-
      A distant forest background. From left: the broadband LWIR image, then
      depth maps from UniDepth-V2, physics inversion and SpecDepth (colour
      shows depth).

- group: earlier
  name: Time-Resolved Particle Beam Microscopy
  dates: Jan – Nov 2023
  org: Boston University
  image: /img/PBMS.png
  w: 834
  h: 834
  image_alt: Schematic of a time-resolved particle beam microscope scan
  description: >-
    Learning-based scan-jitter correction for SEM, using a simulated forward
