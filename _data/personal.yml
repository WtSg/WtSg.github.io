# Research threads. `cite` names an `id` in publications.yml and renders as [n].
research_threads:
  - lead: Diffusion posterior sampling when the forward model is uncertain
    text: >-
      An uncertainty-aware likelihood (UAL) keeps pretrained diffusion priors
      reliable under model mismatch %cite%.
    cite: ual
  - lead: Guidance for diffusion models
    text: >-
      A noise-aware guidance schedule improves sample quality at no extra cost
      (23–30% lower FID on DiT-XL/2).
  - lead: Efficient LLM architectures
    text: >-
      that share information across Transformer layers without reading from
      every layer (in recent tests at 40M parameters, 8.9% lower held-out
      perplexity than a standard Transformer, and ahead of Kimi's Block
      Attention Residuals, published in 2026).
    joined: true
  - lead: Physics-guided adaptation
    text: >-
      Adapted a frozen depth foundation model to a new infrared sensor without
      labels.

